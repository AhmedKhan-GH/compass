<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compass</title>
<meta name="description" content="Compass, the technical skill practice platform from Sternbild. Practice technical skills from the absolute basics.">
<meta name="theme-color" content="#12110f">
<link rel="canonical" href="https://ahmedkhan-gh.github.io/compass/">
<link rel="icon" href="assets/compass-icon-32.png?v=2" sizes="32x32">
<link rel="icon" href="assets/compass-icon.svg?v=4" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/compass-icon-180.png?v=2">
<meta property="og:title" content="Compass">
<meta property="og:description" content="Compass, the technical skill practice platform from Sternbild. Practice technical skills from the absolute basics.">
<meta property="og:image" content="https://ahmedkhan-gh.github.io/compass/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  @font-face { font-family: "Sternbild Display"; src: url("assets/fonts/SternbildDisplay-Regular.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "Plex Condensed"; src: url("assets/fonts/IBMPlexSansCondensed-Regular.ttf") format("truetype"); font-display: swap; }

  /* The Sternbild palette, as on the Caliper site. */
  :root {
    --night: #12110f;
    --deep: #1c1b18;
    --ground: #181715;
    --plate: #272622;
    --plate-hover: #312f2b;
    --rule: #4b4945;
    --rule-faint: #2c2b28;
    --parchment: #e8e0d0;
    --secondary: #c1baaa;
    --faint: #8f897c;
    --bronze: #b38b59;
    --bronze-hover: #c49b68;
    --max: 1160px;
    --display: "Sternbild Display", "Plex Condensed", sans-serif;
    --text: "Plex Condensed", -apple-system, "Helvetica Neue", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--ground); color: var(--parchment); font: 17px/1.65 var(--text); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; height: auto; }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 28px; }

  /* Buttons: inscriptional caps on a ruled plate. */
  .btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px 11px; font: 14px/1 var(--display);
         letter-spacing: .16em; text-transform: uppercase; cursor: pointer; transition: background .15s, color .15s; }
  /* A download that isn't out yet: greyed and not a link, as on the Caliper and Falcon sites. */
  .btn .sep { font-family: var(--text); }   /* the display face has no middle dot */
  .btn-soon { color: var(--faint); background: var(--plate); border: 1px solid var(--rule); border-radius: 4px; opacity: .6; cursor: not-allowed; }
  .btn-ghost { color: var(--parchment); background: var(--plate); border: 1px solid var(--rule); border-radius: 4px; }
  .btn-ghost:hover { background: var(--plate-hover); border-color: var(--faint); }

  /* Navigation */
  nav { position: sticky; top: 0; z-index: 20; background: rgba(18, 17, 15, .86); backdrop-filter: blur(12px); border-bottom: 1px solid var(--rule-faint); }
  nav .wrap { display: flex; align-items: center; gap: 30px; height: 64px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 36px; height: 36px; }
  .brand span { font: 17px/1 var(--display); letter-spacing: .22em; padding-top: 2px; }
  nav .links { display: flex; gap: 26px; margin-left: auto; color: var(--secondary); font: 13px/1 var(--display); letter-spacing: .18em; text-transform: uppercase; }
  nav .links a:hover { color: var(--parchment); }
  nav .btn { padding: 10px 16px 9px; font-size: 12px; }

  /* Hero, lit as on the Caliper site: a fall of light from above and five beams along the seal's construction
     rays (0, 18 and 36 degrees either side of the upright), rising from one point. No round light. */
  header.hero { position: relative; overflow: hidden; padding: 92px 0 0; text-align: center;
                background: linear-gradient(180deg, var(--night) 0%, var(--ground) 78%); }
  header.hero::before { content: ""; position: absolute; inset: 0 0 auto; height: 520px; pointer-events: none;
                        background: linear-gradient(180deg, rgba(232, 224, 208, .055), rgba(232, 224, 208, 0) 100%); }
  .aura { position: absolute; left: 50%; top: 0; width: 1600px; height: 980px; transform: translateX(-50%); pointer-events: none; }
  .beam-layer { will-change: opacity; animation: beam-breathe var(--beam-cycle) ease-in-out var(--beam-phase) infinite; }
  @keyframes beam-breathe { 0%, 100% { opacity: .58; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .beam-layer { animation: none; opacity: .8; } }
  .hero .wrap { position: relative; }
  .hero-mark { width: 136px; height: 136px; margin: 0 auto 26px; filter: drop-shadow(0 18px 30px rgba(0, 0, 0, .45)); }
  /* The name is the hero's headline; the trailing letter-space is padded on the left so the word sits centred. */
  .hero h1 { font: clamp(44px, 10.5vw, 116px)/1 var(--display); letter-spacing: .16em; padding-left: .16em; margin: 0 auto;
             font-weight: normal; text-transform: uppercase; text-shadow: 0 18px 44px rgba(0, 0, 0, .55); }
  .tagline { font: clamp(15px, 2vw, 22px)/1.4 var(--display); letter-spacing: .2em; padding-left: .2em; text-transform: uppercase;
             color: var(--secondary); margin: 22px auto 26px; max-width: 980px; text-wrap: balance; }
  .lede { color: var(--secondary); font-size: clamp(17px, 1.9vw, 20px); max-width: 720px; margin: 0 auto 36px; text-wrap: pretty; }   /* as on the Caliper site */
  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  button.btn { margin: 0; }

  .chip { padding: 6px 13px 5px; border: 1px solid var(--rule); border-radius: 3px; background: var(--plate); font: 12px/1.4 var(--display); letter-spacing: .18em; text-transform: uppercase; color: var(--secondary); }
  /* The screenshot is the real macOS window: rounded like the desktop draws it, with its edge and shadow. */
  .shot { margin: 64px auto 0; max-width: 1100px; }
  .hero .shot { max-width: none; width: min(1220px, calc(100vw - 56px)); margin-left: 50%; transform: translateX(-50%); }
  .shot img { border-radius: 9px; box-shadow: 0 0 0 1px rgba(232, 224, 208, .12), 0 40px 90px rgba(0, 0, 0, .7); }

  footer { margin-top: 120px; border-top: 1px solid var(--rule-faint); background: var(--night); padding: 44px 0 56px; color: var(--faint); font-size: 14px; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 28px; align-items: center; justify-content: space-between; }
  .house { display: flex; align-items: center; gap: 20px; color: var(--secondary); }
  .house img { width: 72px; height: 72px; }
  .house-text { display: flex; flex-direction: column; gap: 10px; }
  .house-name { font: 24px/1 var(--display); letter-spacing: .3em; color: var(--parchment); }
  .house-url { font: 15px/1 var(--text); letter-spacing: .04em; color: var(--faint); }
  .house:hover .house-url { color: var(--bronze-hover); }
  footer .links { display: flex; gap: 22px; flex-wrap: wrap; font: 12px/1 var(--display); letter-spacing: .18em; text-transform: uppercase; }
  footer a:hover { color: var(--parchment); }

  @media (max-width: 900px) {
    nav .links { display: none; }
    nav .btn { margin-left: auto; }
  }
  @media (max-width: 680px) {
  }
  @media (max-width: 520px) {
    header.hero { padding-top: 64px; }
    .wrap { padding: 0 18px; }
  }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="brand" href="#top"><img src="assets/compass-icon.svg?v=4" alt=""><span>COMPASS</span></a>
    <div class="links">
      <a href="https://sternbild.org">Sternbild ↗</a>
    </div>
    <span class="btn btn-soon" role="button" aria-disabled="true" title="Download in preparation">Download</span>
  </div>
</nav>

<header class="hero" id="top">
  <svg class="aura aura-defs" viewBox="0 0 1600 980" aria-hidden="true">
    <defs>
      <!-- Beam strength, thinness and softness as on the Sternbild organisation page (its stops .12,
           .092, .055, its beam profile and its beam-light filter), in Caliper's warm white. -->
      <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#e8e0d0" stop-opacity=".12"/>
        <stop offset=".5" stop-color="#e8e0d0" stop-opacity=".092"/>
        <stop offset="1" stop-color="#e8e0d0" stop-opacity=".055"/>
      </linearGradient>
      <linearGradient id="horizon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1600" y2="0">
        <stop offset="0" stop-color="#6a655a" stop-opacity=".55"/><stop offset=".5" stop-color="#6a655a"/><stop offset="1" stop-color="#6a655a" stop-opacity=".55"/>
      </linearGradient>
      <filter id="beam-light" filterUnits="userSpaceOnUse" x="-60" y="-40" width="1720" height="1000" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="soft"/>
        <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="wide"/>
        <feComponentTransfer in="wide" result="glow"><feFuncA type="linear" slope=".85"/></feComponentTransfer>
        <feMerge><feMergeNode in="glow"/><feMergeNode in="soft"/></feMerge>
      </filter>
    </defs>
    <!-- Five beams from one point at the horizon, along 0, 18 and 36 degrees either side of the upright. -->
  </svg>
  <svg class="aura beam-layer" viewBox="0 0 1600 980" aria-hidden="true" style="--beam-cycle:13.2s;--beam-phase:-7.1s"><polygon points="798.8,840.9 99.9,-26.5 192.3,-93.5 801.2,839.1" fill="url(#beam)" filter="url(#beam-light)"/></svg>
  <svg class="aura beam-layer" viewBox="0 0 1600 980" aria-hidden="true" style="--beam-cycle:9.6s;--beam-phase:-3.3s"><polygon points="798.6,840.5 461.2,-44.9 554.0,-75.1 801.4,839.5" fill="url(#beam)" filter="url(#beam-light)"/></svg>
  <svg class="aura beam-layer" viewBox="0 0 1600 980" aria-hidden="true" style="--beam-cycle:11.7s;--beam-phase:-9.2s"><polygon points="798.5,840.0 753.5,-60.0 846.5,-60.0 801.5,840.0" fill="url(#beam)" filter="url(#beam-light)"/></svg>
  <svg class="aura beam-layer" viewBox="0 0 1600 980" aria-hidden="true" style="--beam-cycle:14s;--beam-phase:-1.4s"><polygon points="798.6,839.5 1046.0,-75.1 1138.8,-44.9 801.4,840.5" fill="url(#beam)" filter="url(#beam-light)"/></svg>
  <svg class="aura beam-layer" viewBox="0 0 1600 980" aria-hidden="true" style="--beam-cycle:8.8s;--beam-phase:-4.8s"><polygon points="798.8,839.1 1407.7,-93.5 1500.1,-26.5 801.2,840.9" fill="url(#beam)" filter="url(#beam-light)"/></svg>
  <svg class="aura" viewBox="0 0 1600 980" aria-hidden="true">
    <!-- Construction: the horizon and three rings about the point, as on the Sternbild organisation page (radii 270, 550 and 830,
         280 apart; same stroke and opacities, each ring a little fainter outwards). -->
    <g fill="none" stroke="#6a655a" stroke-width="1.5" vector-effect="non-scaling-stroke">
      <line x1="0" y1="840.5" x2="1600" y2="840.5" stroke="url(#horizon)"/>
      <path d="M 530 840 A 270 270 0 0 1 1070 840"/>
      <path d="M 250 840 A 550 550 0 0 1 1350 840" stroke-opacity=".86"/>
      <path d="M -30 840 A 830 830 0 0 1 1630 840" stroke-opacity=".72"/>
    </g>
  </svg>
  <div class="wrap">
    <img class="hero-mark" src="assets/compass-icon.svg?v=4" alt="Compass" width="136" height="136">
    <h1>Compass</h1>
    <p class="tagline">Technical skill practice platform</p>
    <p class="lede">Practice technical skills from the absolute basics. Understand first, then accelerate.</p>
    <div class="actions">
      <button class="btn btn-soon" type="button" data-release-download disabled title="A packaged download is in preparation">Download <span class="sep">&middot;</span> in preparation</button>
    </div>
    <div class="shot"><img src="assets/workspace.png?v=3" width="2880" height="1800"
      alt="The Compass workspace in the dark scheme on the Scanner to printer exercise: the instructions and task list on the left, the Verilog solution in the editor, and the waveform dock after all tests passed"></div>
  </div>
</header>

<footer>
  <div class="wrap">
    <a class="house" href="https://sternbild.org"><img src="assets/sternbild-logo.svg" alt=""><span class="house-text"><span class="house-name">STERNBILD</span><span class="house-url">sternbild.org</span></span></a>
    <div class="links">
      <a href="mailto:emailahmedebadkhan@gmail.com">Contact</a>
      <span>© 2026 Ahmed Khan</span>
    </div>
  </div>
</footer>

</body>
</html>
