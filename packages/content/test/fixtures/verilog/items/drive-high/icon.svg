<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile-fill" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7f2e8"/>
      <stop offset="1" stop-color="#e3d9c7"/>
    </linearGradient>
    <filter id="tile-shadow" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse" data-vc-blend="multiply" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="1"/><feOffset dx="0" dy="1" result="shadow"/><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <circle id="lamp" cx="32" cy="32" r="6"/>
  </defs>
  <title>First Light</title>
  <g filter="url(#tile-shadow)" data-name="Tile">
    <rect x="6" y="6" width="52" height="52" fill="url(#tile-fill)"/>
  </g>
  <use xlink:href="#lamp" fill="#a3957e"/>
</svg>
