name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  content:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run runner:images
      - name: Start the runner
        run: |
          npm run runner &
          for attempt in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:3101/v1/health && break
            sleep 1
          done
      - run: npm run test:docker
      - run: npm run content:check
