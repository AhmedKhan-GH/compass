# Compass CI — build, test, and catalog-include lint.
#
# NOTE: The first build compiles static wxWidgets from source (~10 minutes).
# A wx build cache keyed on cmake/External/wxwidgets.cmake is advisable so
# subsequent runs skip that cost — see the "Cache wxWidgets build" step below.
#
# SCOPE (D13/C1): the `compass` app consumes libcaliper from a local caliper
# tree that can't exist on a runner, so CI configures with
# -DCOMPASS_WITH_CALIPER=OFF and builds/tests the caliper-free subset — the wx
# shell (compass_shell + compass::Canvas2D) and the demos, on macOS and Windows.
# This finally compile-tests the Windows Canvas2D GL loader (canvas2d.cpp, marked
# UNVERIFIED). The C2 core/tests need caliper headers and are covered only when a
# fetchable, pinned caliper dependency lands (tracked follow-up).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-lint:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # First build compiles static wxWidgets from source — ~10 min on macOS,
      # longer for the static msw build on Windows. Cache keyed on the recipe so
      # it invalidates when the wx version/config changes. (Best-effort path.)
      - name: Cache wxWidgets build
        uses: actions/cache@v4
        with:
          path: build/third_party
          key: wx-${{ runner.os }}-${{ hashFiles('cmake/External/wxwidgets.cmake') }}

      - name: Configure
        run: cmake -S . -B build -DCOMPASS_WITH_CALIPER=OFF

      - name: Build
        run: cmake --build build -j

      # The caliper-free subset ships no unit tests (the C2 suite needs caliper
      # headers); --no-tests=ignore keeps this green rather than erroring on an
      # empty test set, and still fails loudly if a future caliper-free test breaks.
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=ignore

      # catalog-lint is a bash script; Windows runners ship Git Bash.
      - name: Catalog-include lint
        shell: bash
        run: bash scripts/catalog-lint.sh
