# Compass CI — build, test, and catalog-include lint.
#
# NOTE: The first build compiles static wxWidgets from source (~10 minutes).
# A wx build cache keyed on cmake/External/wxwidgets.cmake is advisable so
# subsequent runs skip that cost — see the "Cache wxWidgets build" step below.
#
# DORMANT: this workflow does nothing until the repo has a GitHub remote.
# Once pushed, it runs on pushes and pull requests to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-lint:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # First build compiles static wxWidgets from source — ~10 min on macOS,
      # longer for the static msw build on Windows. Cache keyed on the recipe so
      # it invalidates when the wx version/config changes. (Best-effort path.)
      - name: Cache wxWidgets build
        uses: actions/cache@v4
        with:
          path: build/third_party
          key: wx-${{ runner.os }}-${{ hashFiles('cmake/External/wxwidgets.cmake') }}

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # catalog-lint is a bash script; Windows runners ship Git Bash.
      - name: Catalog-include lint
        shell: bash
        run: bash scripts/catalog-lint.sh
